[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["nat.*"]


[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../.."


[project]
name = "nvidia-nat-weave"
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.11,<3.14"
description = "Subpackage for Weave integration in NeMo Agent Toolkit"
readme = "src/nat/meta/pypi.md"
keywords = ["ai", "observability", "wandb", "pii"]
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
documentation = "https://docs.nvidia.com/nemo/agent-toolkit/latest/"
source = "https://github.com/NVIDIA/NeMo-Agent-Toolkit"

[tool.setuptools_dynamic_dependencies]
dependencies = [
  # Keep package version constraints as open as possible to avoid conflicts with other packages. Always define a minimum
  # version when adding a new package. If unsure, default to using `~=` instead of `==`. Does not apply to nvidia-nat packages.
  # Keep sorted!!!
  "nvidia-nat-core == {version}",
  "presidio-analyzer~=2.2",
  "presidio-anonymizer~=2.2",
  # Weave is pinned to a specfic version as we have seen breaking changes with minor releases
  # Both eval and trace exporting must be tested on any version change
  "weave==0.52.36",
  # transitive dependencies
  # Without this pin, anyone installing nvidia-nat-weave with Python 3.13 gets blis 0.7.11 which doesn't contain a
  # pre-built binary wheel for Python 3.13, leading to a build from source that fails to build.
  "blis~=1.3",
  "fickling>=0.1.12,<1.0.0",
  # Pillow <13 has image-decoder memory-safety vulnerabilities.
  "pillow>=13.0.0,<14.0.0",
  # Security minimum for filelock, pulled in by presidio-analyzer, weave (GHSA-rfpc-qcw5-3pc4).
  "filelock>=4.2.1",
  # Security minimum for gitpython, pulled in by weave (GHSA-gq48-pqfc-9p58).
  "gitpython>=3.2.1",
  # Security minimum for graphql-core, pulled in by weave (GHSA-vj8h-fx38-h3vc).
  "graphql-core>=3.2.12",
  # Security minimum for multidict, pulled in by weave (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
  # Security minimum for requests, pulled in by presidio-analyzer, weave (GHSA-gc5v-m9x4-r6x2).
  "requests>=2.33.0",
]

[tool.setuptools_dynamic_dependencies.optional-dependencies]
test = [
  "nvidia-nat-core[async_endpoints] == {version}",
  "nvidia-nat-eval == {version}",
  "nvidia-nat-test == {version}",
]

[tool.uv]
build-constraint-dependencies = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]
managed = true
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
nvidia-nat-core = { path = "../nvidia_nat_core", editable = true }
nvidia-nat-eval = { path = "../nvidia_nat_eval", editable = true }
nvidia-nat-test = { path = "../nvidia_nat_test", editable = true }

[project.entry-points.'nat.components']
nat_weave = "nat.plugins.weave.register"
