[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["nat.*"]


[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../.."


[project]
name = "nvidia-nat-llama-index"
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.11,<3.14"
description = "Subpackage for Llama-Index integration in NeMo Agent Toolkit"
readme = "src/nat/meta/pypi.md"
keywords = ["ai", "rag", "agents"]
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
documentation = "https://docs.nvidia.com/nemo/agent-toolkit/latest/"
source = "https://github.com/NVIDIA/NeMo-Agent-Toolkit"

[tool.setuptools_dynamic_dependencies]
dependencies = [
  # Keep package version constraints as open as possible to avoid conflicts with other packages. Always define a minimum
  # version when adding a new package. If unsure, default to using `~=` instead of `==`. Does not apply to nvidia-nat packages.
  # Keep sorted!!!
  "nvidia-nat-core == {version}",
  "llama-index-core>=0.14.25,<1.0.0",
  "llama-index-embeddings-azure-openai>=0.4.1,<1.0.0",
  "llama-index-embeddings-nvidia>=0.4.2,<1.0.0",
  "llama-index-embeddings-openai>=0.5.1,<1.0.0",
  "llama-index-llms-azure-openai>=0.4.2,<1.0.0",
  "llama-index-llms-bedrock>=0.4.2,<1.0.0",
  "llama-index-llms-litellm>=0.6.3,<1.0.0",
  "llama-index-llms-nvidia>=0.5.1,<1.0.0",
  "llama-index-llms-openai>=0.7.0,<1.0.0",
  "llama-index-readers-file>=0.5.6,<1.0.0",
  "llama-index>=0.14.25,<1.0.0",
  "nltk>=3.10.4,<4.0.0",
  # Transitive dep
  # Remove once llama-index-core updates banks
  "banks>=2.5.1,<3.0.0",
  # Pillow <13 has image-decoder memory-safety vulnerabilities.
  "pillow>=13.0.0,<14.0.0",
  "pypdf>=6.21.2,<7.0.0",
  # Security minimum for aiohttp, pulled in by llama-index-core, llama-index-embeddings-azure-openai,
  # llama-index-embeddings-nvidia (GHSA-494j-54xm-rwp3).
  "aiohttp>=3.14.4",
  # Security minimum for filelock, pulled in by llama-index-llms-litellm (GHSA-rfpc-qcw5-3pc4).
  "filelock>=4.2.1",
  # Security minimum for fsspec, pulled in by llama-index-core, llama-index-embeddings-azure-openai,
  # llama-index-embeddings-nvidia (GHSA-27vj-qcqg-25rc).
  "fsspec>=2026.6.0",
  # Security minimum for litellm, pulled in by llama-index-llms-litellm (GHSA-7hp6-4w63-5g45).
  "litellm>=1.100.4",
  # Security minimum for multidict, pulled in by llama-index-core, llama-index-embeddings-azure-openai,
  # llama-index-embeddings-nvidia (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
  # Security minimum for pyasn1, pulled in by llama-index-llms-bedrock (PYSEC-2026-2263).
  "pyasn1>=0.6.4",
  # Security minimum for pydantic-settings, pulled in by llama-index-llms-litellm (GHSA-4xgf-cpjx-pc3j).
  "pydantic-settings>=2.14.2",
  # Security minimum for requests, pulled in by llama-index-core, llama-index-embeddings-azure-openai,
  # llama-index-embeddings-nvidia (GHSA-gc5v-m9x4-r6x2).
  "requests>=2.33.0",
  # Security minimum for soupsieve, pulled in by llama-index-readers-file (GHSA-j934-xhv5-fg8f).
  "soupsieve>=2.9.0",
  # Security minimum for tinytag, pulled in by llama-index-core, llama-index-embeddings-azure-openai,
  # llama-index-embeddings-nvidia (PYSEC-2026-3386).
  "tinytag>=2.3.0",
]

[tool.setuptools_dynamic_dependencies.optional-dependencies]
test = [
  "nvidia-nat-test == {version}",
]

[tool.uv]
build-constraint-dependencies = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]
managed = true
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
nvidia-nat-core = { path = "../nvidia_nat_core", editable = true }
nvidia-nat-test = { path = "../nvidia_nat_test", editable = true }

[project.entry-points.'nat.components']
nat_llama_index = "nat.plugins.llama_index.register"
