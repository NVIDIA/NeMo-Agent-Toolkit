[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["nat.*"]


[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../.."


[project]
name = "nvidia-nat-crewai"
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.11,<3.14"
readme = "src/nat/meta/pypi.md"
description = "Subpackage for CrewAI integration in NeMo Agent Toolkit"
keywords = ["ai", "rag", "agents"]
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
documentation = "https://docs.nvidia.com/nemo/agent-toolkit/latest/"
source = "https://github.com/NVIDIA/NeMo-Agent-Toolkit"

[tool.setuptools_dynamic_dependencies]
dependencies = [
  # Keep package version constraints as open as possible to avoid conflicts with other packages. Always define a minimum
  # version when adding a new package. If unsure, default to using `~=` instead of `==`. Does not apply to nvidia-nat packages.
  # Keep sorted!!!
  "nvidia-nat-core == {version}",
  "crewai>=1.15.33,<2.0.0",
  # Security minimum for LiteLLM proxy authentication (GHSA-7hp6-4w63-5g45).
  "litellm>=1.100.4,<2.0.0",
  # Pillow <13 has image-decoder memory-safety vulnerabilities.
  "pillow>=13.0.0,<14.0.0",
  # Security minimum for aiohttp, pulled in by crewai, litellm (GHSA-494j-54xm-rwp3).
  "aiohttp>=3.14.4",
  # Security minimum for filelock, pulled in by crewai, litellm (GHSA-rfpc-qcw5-3pc4).
  "filelock>=4.2.1",
  # Security minimum for fsspec, pulled in by crewai, litellm (GHSA-27vj-qcqg-25rc).
  "fsspec>=2026.6.0",
  # Security minimum for multidict, pulled in by crewai, litellm (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
  # Security minimum for oauthlib, pulled in by crewai (GHSA-3jp2-3mrg-2vxc).
  "oauthlib>=4.0.0",
  # Security minimum for pydantic-settings, pulled in by crewai, litellm (GHSA-4xgf-cpjx-pc3j).
  "pydantic-settings>=2.14.2",
  # Security minimum for requests, pulled in by crewai, litellm (GHSA-gc5v-m9x4-r6x2).
  "requests>=2.33.0",
]

[tool.setuptools_dynamic_dependencies.optional-dependencies]
test = [
  "nvidia-nat-test == {version}",
]

[tool.uv]
build-constraint-dependencies = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]
managed = true
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
nvidia-nat-core = { path = "../nvidia_nat_core", editable = true }
nvidia-nat-test = { path = "../nvidia_nat_test", editable = true }

[project.entry-points.'nat.components']
nat_crewai = "nat.plugins.crewai.register"
