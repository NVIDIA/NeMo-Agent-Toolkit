services:
  local-sandbox:
    build:
      dockerfile: Dockerfile.sandbox
    image: ${SANDBOX_NAME:-local-sandbox}
    container_name: local-sandbox
    volumes:
      - ${OUTPUT_DATA_PATH:-./sandbox}:/workspace
    networks:
      - sandbox-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: local-sandbox-nginx
    ports:
      - "127.0.0.1:6000:6000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      local-sandbox:
        condition: service_healthy
    networks:
      - sandbox-internal
      - proxy-ingress
    security_opt:
      - no-new-privileges:true

networks:
  sandbox-internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  proxy-ingress:
    driver: bridge
