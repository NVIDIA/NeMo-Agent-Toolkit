[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["nat.*"]


[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../.."


[project]
name = "nvidia-nat-langchain"
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.11,<3.14"
description = "Subpackage for LangChain/LangGraph integration in NeMo Agent Toolkit"
readme = "src/nat/meta/pypi.md"
keywords = ["ai", "rag", "agents"]
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
documentation = "https://docs.nvidia.com/nemo/agent-toolkit/latest/"
source = "https://github.com/NVIDIA/NeMo-Agent-Toolkit"

[tool.setuptools_dynamic_dependencies]
dependencies = [
  # Keep package version constraints as open as possible to avoid conflicts with other packages. Always define a minimum
  # version when adding a new package. If unsure, default to using `~=` instead of `==`. Does not apply to nvidia-nat packages.
  # Keep sorted!!!
  # Provider integrations (langchain-openai, langchain-aws, ...) are lazy-imported and live in extras below.
  "nvidia-nat-core == {version}",
  "nvidia-nat-eval == {version}",
  "nvidia-nat-opentelemetry == {version}",
  "langchain>=1.3.9,<2.0.0",
  "langchain-classic>=1.0.7,<2.0.0",
  "langchain-core>=1.4.0,<2.0.0",
  "langgraph>=1.2.14,<2.0.0",
  "langsmith>=0.8.18,<1.0.0",
  # Transitive dependencies
  "pyopenssl>=26.0.0,<27.0.0",
  # Security minimum for langgraph-checkpoint, pulled in by langchain, langgraph (PYSEC-2026-2573).
  "langgraph-checkpoint>=4.1.1",
  # Security minimum for langgraph-sdk, pulled in by langchain, langgraph (GHSA-fvww-7h3r-vfhp).
  "langgraph-sdk>=0.4.6",
]

[tool.setuptools_dynamic_dependencies.optional-dependencies]
# Keep sorted!!!
aws = ["langchain-aws>=1.1.0,<2.0.0"]
community = [
  "langchain-community~=0.3,<0.4.2", # langchain_community.chat_models.vertexai removed in 0.4.2
  "wikipedia~=1.4",
  # Security minimum for aiohttp, pulled in by langchain-community (GHSA-494j-54xm-rwp3).
  "aiohttp>=3.14.4",
  # Security minimum for multidict, pulled in by langchain-community (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
  # Security minimum for pydantic-settings, pulled in by langchain-community (GHSA-4xgf-cpjx-pc3j).
  "pydantic-settings>=2.14.2",
  # Security minimum for soupsieve, pulled in by wikipedia (GHSA-j934-xhv5-fg8f).
  "soupsieve>=2.9.0",
]
exa = ["langchain-exa>=1.1.0,<2.0.0"]
huggingface = [
  "langchain-huggingface>=1.2.2,<2.0.0",
  # Security minimum for filelock, pulled in by langchain-huggingface (GHSA-rfpc-qcw5-3pc4).
  "filelock>=4.2.1",
  # Security minimum for fsspec, pulled in by langchain-huggingface (GHSA-27vj-qcqg-25rc).
  "fsspec>=2026.6.0",
]
judge = ["openevals>=0.1.3,<1.0.0"]
litellm = [
  "langchain-litellm>=0.6.5,<1.0.0",
  # Security minimum for aiohttp, pulled in by langchain-litellm (GHSA-494j-54xm-rwp3).
  "aiohttp>=3.14.4",
  # Security minimum for filelock, pulled in by langchain-litellm (GHSA-rfpc-qcw5-3pc4).
  "filelock>=4.2.1",
  # Security minimum for fsspec, pulled in by langchain-litellm (GHSA-27vj-qcqg-25rc).
  "fsspec>=2026.6.0",
  # Security minimum for litellm, pulled in by langchain-litellm (GHSA-7hp6-4w63-5g45).
  "litellm>=1.100.4",
  # Security minimum for multidict, pulled in by langchain-litellm (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
  # Security minimum for pydantic-settings, pulled in by langchain-litellm (GHSA-4xgf-cpjx-pc3j).
  "pydantic-settings>=2.14.2",
]
milvus = ["langchain-milvus>=0.3.3,<1.0.0"]
nvidia = [
  "langchain-nvidia-ai-endpoints>=1.4.2,<2.0.0",
  # Security minimum for aiohttp, pulled in by langchain-nvidia-ai-endpoints (GHSA-494j-54xm-rwp3).
  "aiohttp>=3.14.4",
  # Security minimum for multidict, pulled in by langchain-nvidia-ai-endpoints (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
]
oci = [
  "langchain-oci>=0.2.4,<1.0.0",
  # Security minimum for aiohttp, pulled in by langchain-oci (GHSA-494j-54xm-rwp3).
  "aiohttp>=3.14.4",
  # Security minimum for multidict, pulled in by langchain-oci (GHSA-54p9-h82j-f925).
  "multidict>=6.9.1",
]
openai = ["langchain-openai>=1.1.14,<2.0.0"]

all = [
  # Self-references must stay unversioned: {version} bakes the sha-dependent scm version into uv.lock
  "nvidia-nat-langchain[aws,community,exa,huggingface,judge,litellm,milvus,nvidia,oci,openai]",
]

test = [
  "nvidia-nat-eval[profiling] == {version}",
  "nvidia-nat-langchain[all]",
  "nvidia-nat-test == {version}",
]

[tool.uv]
build-constraint-dependencies = ["setuptools>=84.1.0", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]
managed = true
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
nvidia-nat-core = { path = "../nvidia_nat_core", editable = true }
nvidia-nat-eval = { path = "../nvidia_nat_eval", editable = true }
nvidia-nat-opentelemetry = { path = "../nvidia_nat_opentelemetry", editable = true }
nvidia-nat-test = { path = "../nvidia_nat_test", editable = true }

[project.entry-points.'nat.components']
nat_langchain = "nat.plugins.langchain.register"
nat_langchain_tools = "nat.plugins.langchain.tools.register"
