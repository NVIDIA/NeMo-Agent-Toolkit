[pytest]
# Ignore any package that isn't included in the "most" extra
# Users can still explicitly run tests in excluded packages, and these are explicitly executed by run_tests.py
addopts =
    --ignore=examples/
    --ignore=packages/nvidia_nat_openpipe_art
    --ignore=packages/nvidia_nat_rag
testpaths =
    tests
markers =
    benchmark: Benchmarks
    integration: Integration tests which do not use mocks and may require external services
    requires_cache: Tests that require a reverse-proxy cache to be running
    slow: Slow tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
filterwarnings =
    # Upstream libraries still using Pydantic V1 APIs.
    ignore::pydantic.warnings.PydanticDeprecatedSince20:(nemoguardrails\.rails\.llm\.(config|options)|langchain_community\.(llms\.(azureml_endpoint|sambanova)|chat_models\.sambanova))
    ignore:The `__fields__` attribute is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20:inspect
    ignore:The `__fields_set__` attribute is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20:inspect
    # Upstream LlamaIndex warnings exercised by the NIM integration test.
    ignore:is_running called from within a step.*:DeprecationWarning:llama_index\.core\.agent\.workflow\.react_agent

# Global timeout of 5 minutes per test to catch hanging tests.
# Individual tests can override with @pytest.mark.timeout(seconds) or disable with @pytest.mark.timeout(0)
timeout = 300
